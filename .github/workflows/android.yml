name: Android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts the change touches, so a change to the website alone doesn't build the app
  # (and the other way round). The job below is then skipped, which counts as passing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          # A pull request: its base; a push to main: main before it.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PATTERN: '^(app/|airplay/|third_party/|gradle/|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|\.gitmodules|\.github/workflows/android\.yml)'
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" HEAD)"
          else
            files="(unknown base: everything)"
          fi
          echo "$files"
          if [ "$files" = "(unknown base: everything)" ] || echo "$files" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Top level only: OpenSSL's own submodules (test data, other libraries) aren't needed.
          submodules: true

      # AGP 8.7's prefab step fails on the newest JDKs; 21 is what Android Studio bundles.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # OpenSSL's libcrypto, built from the submodule (tools/build-openssl.sh, which Gradle runs);
      # kept between runs until the submodule or the NDK changes.
      - name: Note the OpenSSL commit
        id: openssl
        run: echo "commit=$(git rev-parse HEAD:third_party/openssl)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: third_party/openssl-android
          key: openssl-android-${{ steps.openssl.outputs.commit }}-ndk27.0.12077973

      - name: Install the pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Build and unit test
        run: ./gradlew assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CastBay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
