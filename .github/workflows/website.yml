name: Website

# Cloudflare builds and publishes web/ (Astro) from main; this catches a change that would
# break that build, before it's merged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  website-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the website
        working-directory: web
        env:
          # For the release checksums the changelog fetches from GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --no-fund --no-audit
          npm run build
