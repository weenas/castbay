name: Website

# website/*.html are built from site/ by scripts/build_website.py and committed; this fails
# when one was edited directly, or site/ changed without rebuilding.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pages-up-to-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check website/ matches site/
        run: python3 scripts/build_website.py --check
