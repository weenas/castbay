name: Website

# Cloudflare builds and publishes web/ (Astro) from main; this catches a change that would
# break that build, before it's merged, and after a merge that changes web/ makes sure
# Cloudflare rebuilds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  website-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the website
        working-directory: web
        env:
          # For the release checksums the changelog fetches from GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --no-fund --no-audit
          npm run build

  # Cloudflare builds main on its own, but has missed a push; once the website has built here,
  # a change under web/ also asks it to rebuild through the deploy hook (as releases do). A
  # rebuild of the same commit is harmless.
  deploy:
    needs: website-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: website-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild the website if web/ changed
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$HOOK" ]; then echo "No CLOUDFLARE_DEPLOY_HOOK secret; skipped"; exit 0; fi
          # A new branch or a force push has no usable "before"; rebuild to be safe.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- web/; then
            echo "No change under web/; skipped"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Website rebuild started"
