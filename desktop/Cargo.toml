[workspace]
resolver = "2"
members = ["core/capture", "core/encode", "core/link", "core/sender", "core/cli", "app"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/weenas/castbay"
publish = false

[profile.release]
# The debug information was 160 of the 188 MB of the Linux binary (25 MB as a .deb). The function
# names stay (crash reports print a backtrace); the file and line numbers do not.
debug = 0
strip = "debuginfo"
