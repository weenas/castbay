<!-- The shell every page shares; scripts/build_website.py fills in the {{...}} slots. -->
<!doctype html>
<html lang="{{html_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <link rel="alternate" hreflang="en" href="{{url_en}}">
  <link rel="alternate" hreflang="zh-CN" href="{{url_zh}}">
  <link rel="alternate" hreflang="x-default" href="{{url_en}}">
  <meta name="theme-color" content="#0b0910">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CastBay">
  <meta property="og:locale" content="{{og_locale}}">
  <meta property="og:locale:alternate" content="{{og_locale_alt}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="https://castbay.weenas.com/assets/og.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/logo.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/site.js"></script>
{{structured_data}}</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="{{home}}"><img class="wm-dark" src="/assets/wordmark@2x.png?v=2" srcset="/assets/wordmark@2x.png?v=2 2x, /assets/wordmark@3x.png?v=2 3x" alt="CastBay 映湾" width="250" height="60"><img class="wm-light" src="/assets/wordmark-light@2x.png?v=2" srcset="/assets/wordmark-light@2x.png?v=2 2x, /assets/wordmark-light@3x.png?v=2 3x" alt="CastBay 映湾" width="250" height="60"></a>
    <nav class="nav">
{{nav}}    </nav>
    <button id="theme-btn" class="theme" type="button" title="{{theme_title}}" aria-label="{{theme_to_light}}" data-to-light="{{theme_to_light}}" data-to-dark="{{theme_to_dark}}"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3h.393a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 2.992z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.828 14.828a4 4 0 1 0-5.656-5.656 4 4 0 0 0 5.656 5.656M6.343 17.657l-1.414 1.414M6.343 6.343 4.929 4.929M17.657 6.343l1.414-1.414M17.657 17.657l1.414 1.414M4 12H2M12 4V2M20 12h2M12 20v2"/></svg></button>
    <a class="lang" href="{{other_url}}" hreflang="{{other_hreflang}}" lang="{{other_hreflang}}" data-lang-link="{{other_lang}}">{{other_label}}</a>
  </div>
</header>

{{main}}

<footer>
  <div class="wrap">
    <div>
      <div>{{copyright}}</div>
      <div style="margin-top:6px;max-width:44em">
        {{trademarks}}
      </div>
    </div>
    <div class="links">
{{footer_links}}    </div>
  </div>
</footer>
</body>
</html>
